name: provider setup e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-provider-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: scripts/fresh-provider-setup-tests.sh
