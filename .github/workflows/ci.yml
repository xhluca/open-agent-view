name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: python3 -m unittest scripts/test_compact_real_recordings.py

  test:
    strategy:
      matrix:
        rust: ["1.75.0", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --locked
      - run: cargo build --release --locked

  native-portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: scripts/test-installer.sh
      - run: scripts/package-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo test --locked
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Test native startup without HOME
        shell: pwsh
        run: |
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "oav-profile"
          New-Item -ItemType Directory -Path $env:USERPROFILE -Force | Out-Null
          $json = & .\target\x86_64-pc-windows-msvc\release\open-agent-view.exe --json --no-host-providers | ConvertFrom-Json
          if ($json.sessions.Count -ne 0 -or $json.warnings.Count -ne 0) { throw "unexpected smoke-test output" }
      - shell: pwsh
        run: .\scripts\test-installer.ps1
      - shell: pwsh
        run: .\scripts\package-release.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: release-x86_64-pc-windows-msvc
          path: |
            dist/*.zip
            dist/*.zip.sha256

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - run: npm run export
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: website-playwright-results
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
