name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          targets: ${{ env.TARGET }}

      - name: Validate tag and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          version="${tag#v}"
          package_version="$({
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "open-agent-view") | .version'
          })"
          if [[ "${package_version}" != "${version}" ]]; then
            echo "tag ${tag} does not match Cargo package version ${package_version}" >&2
            exit 1
          fi

          stem="open-agent-view-${version}-${TARGET}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "stem=${stem}" >>"${GITHUB_OUTPUT}"
          echo "archive=${stem}.tar.gz" >>"${GITHUB_OUTPUT}"

      - name: Test installer behavior and locked source
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-installer.sh
          cargo test --locked
          cargo build --release --locked --target "${TARGET}"

      - name: Create archive and checksum
        shell: bash
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          STEM: ${{ steps.release.outputs.stem }}
        run: |
          set -euo pipefail
          install -d "dist/${STEM}"
          install -m 0755 "target/${TARGET}/release/coding-agents" "dist/${STEM}/coding-agents"
          install -m 0644 LICENSE README.md "dist/${STEM}/"

          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            source_date_epoch="$(git show -s --format=%ct HEAD)"
            tar \
              --sort=name \
              --mtime="@${source_date_epoch}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C dist \
              -czf "dist/${ARCHIVE}" \
              "${STEM}"
          else
            COPYFILE_DISABLE=1 tar -C dist -czf "dist/${ARCHIVE}" "${STEM}"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${ARCHIVE}" >"${ARCHIVE}.sha256")
          else
            (cd dist && shasum -a 256 "${ARCHIVE}" >"${ARCHIVE}.sha256")
          fi

      - name: Smoke-test the packaged binary
        shell: bash
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          install -d smoke
          tar -xzf "dist/${ARCHIVE}" -C smoke
          binary="smoke/${STEM}/coding-agents"
          test "$("${binary}" --version)" = "coding-agents ${VERSION}"
          "${binary}" --help | grep -F "Open terminal dashboard" >/dev/null
          "${binary}" --json --no-host-claude --no-host-codex |
            jq -e '.sessions == [] and .warnings == []' >/dev/null

      - name: Test installer against the packaged assets
        shell: bash
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/open-agent-view-release"
          install_root="${RUNNER_TEMP}/open-agent-view-install/bin"
          install -d "${release_root}/v${VERSION}"
          install -m 0644 \
            "dist/${ARCHIVE}" \
            "dist/${ARCHIVE}.sha256" \
            "${release_root}/v${VERSION}/"

          OAV_VERSION="${VERSION}" \
          OAV_INSTALL_DIR="${install_root}" \
          OAV_RELEASE_BASE_URL="file://${release_root}" \
            ./install.sh

          test "$("${install_root}/coding-agents" --version)" = \
            "coding-agents ${VERSION}"

      - name: Retain packaged assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ steps.release.outputs.archive }}
            dist/${{ steps.release.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all verified release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify the complete target set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
          )
          for target in "${targets[@]}"; do
            archive="dist/open-agent-view-${version}-${target}.tar.gz"
            test -f "${archive}"
            test -f "${archive}.sha256"
            (cd dist && sha256sum --check "$(basename "${archive}.sha256")")
          done

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            --verify-tag \
            --generate-notes \
            --title "open-agent-view ${GITHUB_REF_NAME}"
