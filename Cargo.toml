[package]
name = "open-agent-view"
version = "0.1.10"
edition = "2021"
rust-version = "1.75"
description = "Open terminal dashboard for supervising multiple coding-agent CLIs"
license = "MIT"
repository = "https://github.com/xhluca/open-agent-view"
readme = "README.md"
keywords = ["agents", "coding-agents", "tui", "terminal", "dashboard"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "coding-agents"
path = "src/main.rs"

[dependencies]
# Exact versions keep the project buildable with the documented Rust 1.75 MSRV.
anyhow = "=1.0.86"
clap = { version = "=4.5.4", features = ["derive"] }
crossterm = "=0.27.0"
libc = "=0.2.189"
ratatui = "=0.26.3"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
tungstenite = { version = "=0.21.0", default-features = false, features = ["handshake"] }
# Keep the transitive URL parser compatible with the project's Rust 1.75 MSRV.
# Newer url 2.5.x releases pull in edition-2024 IDNA crates.
url = "=2.4.1"
# Ratatui's compatible range otherwise resolves to a release requiring Rust 1.85.
unicode-segmentation = "=1.12.0"
vt100 = "=0.15.2"

[dev-dependencies]
pretty_assertions = "=1.4.0"
tempfile = "=3.10.1"
